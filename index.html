<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mutation Observer Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 700px;
            max-width: 90%;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        #parentDiv {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .box {
            width: 130px;
            height: 130px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            cursor: text;
            transition: 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .box:hover {
            transform: translateY(-5px);
        }

        .div1 {
            background: #ff6b6b;
        }

        .div2 {
            background: #1dd1a1;
        }

        .div3 {
            background: #5f27cd;
        }

        .btn-wrapper {
            text-align: center;
        }

        button {
            border: none;
            background: #ff4757;
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e84118;
            transform: translateY(-2px);
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #f5f6fa;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Mutation Observer</h2>
        <p class="subtitle">
            Edit any box below and click Delete to observe DOM changes.
        </p>

        <div id="parentDiv">
            <div contenteditable class="box div1">Div 1</div>
            <div contenteditable class="box div2">Div 2</div>
            <div contenteditable class="box div3">Div 3</div>
        </div>

        <div class="btn-wrapper">
            <button onclick="deletediv()">Delete First Div</button>
        </div>

        <div class="note">
            <strong>Note:</strong> MutationObserver watches for changes in the DOM.
            When a child element is removed, the remaining elements are
            automatically recolored.
        </div>
    </div>

    <script>
        const observer = new MutationObserver((mutations) => {
            console.log(mutations);

            if (parentDiv.children[0]) {
                parentDiv.children[0].style.backgroundColor = "#6c5ce7";
                parentDiv.children[0].style.color = "#fff";
            }

            if (parentDiv.children[1]) {
                parentDiv.children[1].style.backgroundColor = "#2d3436";
                parentDiv.children[1].style.color = "#fff";
            }
        });

        observer.observe(parentDiv, {
            childList: true,
        });

        function deletediv() {
            parentDiv.children[0]?.remove();
        }
    </script>
</body>

</html>
